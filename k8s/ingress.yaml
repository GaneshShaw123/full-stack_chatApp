apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
      name: chatapp-ingress
      namespace: chat-app
      labels:
          name: chatapp-ingress
      annotations:
           nginx.ingress.kubernetes.io/rewrite-target: /
           nginx.ingress.kubernetes.io/ssl-redirect: “false”
spec:
  rules:
  - host: chat-tws.com
    paths:
    - pathType: Prefix
      Path: “/”
      backend:
        service:
          name: frontend
          port:
            number: 80
    - pathType: Prefix
      Path: “/api”
      backend:
        service:
          name: backend
          port:
              number: 5001








      

  


                          

 





   


    


  

